name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

# Read only, apart from the release job below
permissions:
  contents: read

# Actions are pinned to full commits, with the release each one is beside it

jobs:
  build:
    runs-on: ubuntu-latest
    # Whether the release APK was signed, which decides if the release job runs
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Install the NDK the project pins
        # The runner's shell has pipefail on, and yes dies of SIGPIPE once
        # sdkmanager stops reading, so its exit code is not the one that counts
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null

      - name: Unit tests
        run: ./gradlew --no-daemon testNonRootDebugUnitTest

      - name: Native unit tests
        run: make -C app/src/test/cpp test

      - name: Translations
        run: python3 tools/check_strings.py

      # A tag build signs the release APK with the keystore held in the
      # repository secrets, which only this step can see. Without them it
      # still builds and publishes the unsigned APK, which has to be signed by
      # hand the way the README describes.
      - name: Signing key
        id: sign
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key in the secrets, the release APK stays unsigned and is not attached to the release"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=${KEY_ALIAS:-moonlightvr}
          EOF

      - name: Build
        run: ./gradlew --no-daemon assembleNonRootDebug assembleNonRootRelease lintNonRootRelease

      - name: Install build-tools for signing
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" > /dev/null

      - name: Sign a throwaway APK so it can be sideloaded straight from here
        # A convenience signature for every push, separate from the tag
        # release's real keystore above: lets a build fresh off master or a
        # branch install on a headset without the person touching keytool,
        # zipalign or apksigner themselves. The password is deliberately
        # fixed and public, so this is only ever for sideloading onto your
        # own headset, never a stand-in for a real release signature.
        run: |
          set -e
          TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          keytool -genkeypair -v -keystore throwaway.keystore -alias throwaway \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass throwaway123 -keypass throwaway123 \
            -dname "CN=Moonlight XR sideload, OU=throwaway, O=throwaway, L=NA, S=NA, C=US"
          "$TOOLS/zipalign" -f 4 \
            app/build/outputs/apk/nonRoot/release/app-nonRoot-release-unsigned.apk \
            moonlight-vr-release-signed.apk
          "$TOOLS/apksigner" sign --ks throwaway.keystore --ks-pass pass:throwaway123 \
            moonlight-vr-release-signed.apk
          "$TOOLS/apksigner" verify moonlight-vr-release-signed.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: moonlight-xr-release-signed
          path: moonlight-vr-release-signed.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: moonlight-xr-release
          path: app/build/outputs/apk/nonRoot/release/*.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-nonRootRelease.html
          if-no-files-found: ignore

  # The one job that can write to the repository, and all it runs is the
  # release action on the APK the build job made. Only a signed APK is
  # attached: an unsigned one cannot install over the signed app, so a tag
  # pushed without the secrets leaves the release's files to the owner.
  release:
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.signed == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: moonlight-xr-release
          path: apk

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: apk/*.apk
          generate_release_notes: true
